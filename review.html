        // Tag colors: green = positive (4-5 stars, and positives at 3), orange = 3-star improvements, red = 1-2 star improvements
        const TAG_STYLES = {
            green:  { hover: 'hover:border-green-500',  on: ['bg-green-600', 'text-white', 'border-green-600'] },
            orange: { hover: 'hover:border-orange-500', on: ['bg-orange-500', 'text-white', 'border-orange-500'] },
            red:    { hover: 'hover:border-red-500',    on: ['bg-red-600', 'text-white', 'border-red-600'] }
        };
        const TAG_OFF = ['bg-white', 'text-slate-800', 'border-slate-200'];

        // Swaps (not stacks) the classes so the selected color always wins and the text stays readable
        function applyTagState(btn, color, selected) {
            const style = TAG_STYLES[color];
            if (selected) {
                btn.classList.remove(...TAG_OFF);
                btn.classList.add(...style.on);
            } else {
                btn.classList.remove(...style.on);
                btn.classList.add(...TAG_OFF);
            }
        }

        // Builds a selectable tag button.
        // `tag` is always the English value (what gets saved); `label` is what the customer sees.
        // `list` is the array that holds the selected English tag values.
        function createTagButton(tag, label, list, color) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = label;
            btn.className = `px-3 py-1.5 border rounded-xl text-xs font-medium transition-all ${TAG_STYLES[color].hover}`;
            applyTagState(btn, color, list.includes(tag));
            btn.onclick = () => {
                const idx = list.indexOf(tag);
                if (idx > -1) {
                    list.splice(idx, 1);
                    applyTagState(btn, color, false);
                } else {
                    if (list.length >= MAX_TAGS) return;
                    list.push(tag);
                    applyTagState(btn, color, true);
                }
            };
            return btn;
        }

        function toTagArray(raw) {
            if (Array.isArray(raw)) return raw.map(t => String(t).trim()).filter(Boolean);
            if (typeof raw === 'string') return raw.split(',').map(t => t.trim()).filter(Boolean);
            return [];
        }

            if (currentLang !== 'en' && window.tagTrans[currentLang] && window.tagTrans[currentLang][tag]) {

        const starBtns = document.querySelectorAll('.star-btn');
        starBtns.forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                currentRating = idx + 1;
                starBtns.forEach((b, i) => b.classList.toggle('text-amber-400', i < currentRating));
                starBtns.forEach((b, i) => b.classList.toggle('text-slate-300', i >= currentRating));

                const negWrapper = document.getElementById('neg-tags-wrapper');
                const posWrapper = document.getElementById('pos-tags-wrapper');

                if (currentRating === 3) {
                    posWrapper.style.display = 'block';
                    negWrapper.style.display = 'block';
                    renderTags(true);
                } else if (currentRating >= 4) {
                    posWrapper.style.display = 'block';
                    negWrapper.style.display = 'none';
                    renderTags(true);
                } else {
                    posWrapper.style.display = 'none';
                    negWrapper.style.display = 'none';
                }

                document.getElementById('proceed-btn').disabled = false;
            });
        });

        // reset = true clears selections (new star rating); false keeps them (language change)
        function renderTags(reset = true) {
            const posContainer = document.getElementById('tags-container');
            const negContainer = document.getElementById('neg-tags-container');
            posContainer.innerHTML = '';
            negContainer.innerHTML = '';

            if (reset) {
                selectedTags = [];
                selectedNegTags = [];
            }

            // Positive tags: always green
            toTagArray(businessData.positive_tags).forEach(tag => {
                posContainer.appendChild(createTagButton(tag, translateTag(tag), selectedTags, 'green'));
            });

            // Improvement tags (only visible at 3 stars): orange
            toTagArray(businessData.negative_tags).forEach(tag => {
                negContainer.appendChild(createTagButton(tag, translateTag(tag), selectedNegTags, 'orange'));
            });
        }

        // 1-2 star feedback step: red tags
        function renderStrictTags() {
            const container = document.getElementById('neg-tags-container-strict');
            container.innerHTML = '';
            toTagArray(businessData.negative_tags).forEach(tag => {
                container.appendChild(createTagButton(tag, translateTag(tag), selectedTags, 'red'));
            });
        }

        function generateReview() {
            // Make sure the language we send is the one currently selected in the dropdown
            currentLang = document.getElementById('lang-selector').value;
            const requestId = ++reviewRequestId;

            document.getElementById('ai-loading').classList.remove('hidden');
            document.getElementById('ai-content').classList.add('hidden');

            fetch('/api/ai/generate-review', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    rating: currentRating,
                    // Tags go out in the customer's language so the review text is not mixed
                    tags: selectedTags.map(translateTag),
                    business_name: businessData.name,
                    category: businessData.category,
                    customer_name: document.getElementById('customer-name').value.trim(),
                    lang: currentLang
                })
            }).then(res => res.json()).then(data => {
                if (requestId !== reviewRequestId) return; // a newer request replaced this one
                document.getElementById('ai-loading').classList.add('hidden');
                document.getElementById('ai-content').classList.remove('hidden');
                document.getElementById('review-text-output').value = data.review;
            }).catch(() => {
                if (requestId !== reviewRequestId) return;
                document.getElementById('ai-loading').classList.add('hidden');
                document.getElementById('ai-content').classList.remove('hidden');
            });
        }

        document.getElementById('proceed-btn').addEventListener('click', () => {
            const customerName = document.getElementById('customer-name').value.trim();
            if(!customerName) {
                alert("Please enter your name.");
                return;
            }

            document.getElementById('step-rating').classList.add('hidden');

            if (currentRating >= 3) {
                document.getElementById('step-ai-review').classList.remove('hidden');

                // If 3 stars, silently save selected improvement tags as private feedback
                if (currentRating === 3 && selectedNegTags.length > 0) {
                    fetch('/api/reviews/submit', {
                        method: 'POST', headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({
                            business_link: uniqueLink,
                            customer_name: customerName,
                            rating: currentRating,
                            tags: selectedNegTags,
                            feedback_text: `3-Star Areas of Improvement: ${selectedNegTags.join(', ')}`,
                            ai_draft: ""
                        })
                    });
                }

                generateReview();
            } else {
                document.getElementById('step-feedback').classList.remove('hidden');
                selectedTags = [];
                renderStrictTags();
            }
        });

        async function saveReview(feedbackText = "", aiDraft = "") {
            await fetch('/api/reviews/submit', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    business_link: uniqueLink,
                    customer_name: document.getElementById('customer-name').value,
                    rating: currentRating, tags: selectedTags, feedback_text: feedbackText, ai_draft: aiDraft
                })
            });
        }

        document.getElementById('post-google-btn').addEventListener('click', async () => {
            const aiText = document.getElementById('review-text-output').value;
            await saveReview("", aiText);
            navigator.clipboard.writeText(aiText).then(() => {
                window.location.href = businessData.google_link;
            });
        });

        document.getElementById('submit-feedback-btn').addEventListener('click', async () => {
            const extraText = document.getElementById('private-feedback-text').value;
            const combinedFeedback = `Selected Areas to Improve: ${selectedTags.join(', ')} | Notes: ${extraText}`;
            await saveReview(combinedFeedback, "");
            document.getElementById('step-feedback').classList.add('hidden');
            document.getElementById('step-success').classList.remove('hidden');
        });

        // Sync the page with the dropdown on load (browsers can restore a non-English selection after a refresh)
        changeLanguage();
    </script>
