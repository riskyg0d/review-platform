<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <header class="w-full bg-white border-b py-4 px-6 flex justify-between items-center shadow-xs">
        <h1 id="business-name" class="text-lg font-bold">Loading...</h1>
        <select id="lang-selector" onchange="changeLanguage()" class="text-xs border rounded-lg p-1.5 bg-slate-50 font-medium">
            <option value="en">English</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="mr">मराठी (Marathi)</option>
        </select>
    </header>
    <main class="max-w-md w-full mx-auto p-4 sm:p-6 my-auto" id="main-content">
        <div id="step-rating" class="bg-white rounded-2xl shadow-sm border p-6">
            <h2 id="ui-title" class="text-xl font-semibold text-center mb-6">How was your experience?</h2>
            <div class="mb-5">
                <label id="ui-name-label" class="block text-xs font-semibold mb-1">Your Name</label>
                <input type="text" id="customer-name" class="w-full px-4 py-2 border rounded-xl" placeholder="Alex Smith">
            </div>
            <div class="flex justify-center space-x-2 mb-6" id="star-container">
                <button data-value="1" class="star-btn text-3xl text-slate-300">★</button>
                <button data-value="2" class="star-btn text-3xl text-slate-300">★</button>
                <button data-value="3" class="star-btn text-3xl text-slate-300">★</button>
                <button data-value="4" class="star-btn text-3xl text-slate-300">★</button>
                <button data-value="5" class="star-btn text-3xl text-slate-300">★</button>
            </div>
            
            <!-- Positive Tags Section (4-5 stars & 3 stars) -->
            <div class="mb-5" id="pos-tags-wrapper">
                <label id="ui-tags-label" class="block text-xs font-semibold mb-2">What went well? (Select up to 5 tags)</label>
                <div id="tags-container" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1"></div>
            </div>

            <!-- Areas of Improvement Section (3 stars & below) -->
            <div class="mb-6" id="neg-tags-wrapper" style="display: none;">
                <label id="ui-neg-tags-label" class="block text-xs font-semibold mb-2 text-red-600">Areas of Improvement (Select up to 5 tags)</label>
                <div id="neg-tags-container" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pr-1"></div>
            </div>

            <button id="proceed-btn" disabled class="w-full bg-blue-600 text-white py-3 rounded-xl disabled:bg-slate-200 font-medium">Continue</button>
        </div>
        <div id="step-ai-review" class="hidden bg-white rounded-2xl shadow-sm border p-6">
            <h2 id="ui-ready-title" class="text-lg font-semibold text-center mb-4">Review Ready for Google</h2>
            <div id="ai-loading" class="text-center py-4">Generating...</div>
            <div id="ai-content" class="hidden">
                <textarea id="review-text-output" rows="4" class="w-full p-3 border rounded-xl mb-4"></textarea>
                <button id="post-google-btn" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-medium">Post on Google Review</button>
            </div>
        </div>
        <div id="step-feedback" class="hidden bg-white rounded-2xl shadow-sm border p-6">
            <h2 id="ui-private-title" class="text-lg font-semibold text-center mb-4">Areas of Improvement</h2>
            <p id="ui-private-desc" class="text-xs text-slate-500 mb-2">Please select up to 5 tags below so we can improve:</p>
            <div id="neg-tags-container-strict" class="flex flex-wrap gap-2 mb-4 max-h-40 overflow-y-auto pr-1"></div>
            <textarea id="private-feedback-text" rows="2" class="w-full p-3 border rounded-xl mb-4 text-xs" placeholder="Additional details (optional)..."></textarea>
            <button id="submit-feedback-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium mb-3">Post Review & Send Feedback</button>
        </div>
        <div id="step-success" class="hidden bg-white rounded-2xl shadow-sm border p-8 text-center">
            <h2 id="ui-success-title" class="text-xl font-bold text-emerald-600 mb-2">Thank You!</h2>
            <p id="ui-success-desc">Your feedback has been recorded.</p>
        </div>
    </main>
    <footer class="text-center py-6 text-sm">
        <a href="/" class="text-slate-400 hover:text-slate-600 transition-colors">Business Owner Login</a>
    </footer>
    <script>
        const pathParts = window.location.pathname.split('/');
        const uniqueLink = pathParts[pathParts.length - 1];
        let businessData = {};
        let currentRating = 0;
        let selectedTags = [];
        let selectedNegTags = [];
        let currentLang = 'en';
        const MAX_TAGS = 5;

        const i18n = {
            en: {
                title: "How was your experience?",
                nameLabel: "Your Name",
                tagsLabel: "What went well? (Select up to 5 tags)",
                negTagsLabel: "Areas of Improvement (Select up to 5 tags)",
                continueBtn: "Continue",
                readyTitle: "Review Ready for Google",
                postGoogle: "Post on Google Review",
                privateTitle: "Areas of Improvement",
                privateDesc: "Please select up to 5 tags below so we can improve:",
                sendMgmt: "Post Review & Send Feedback",
                successTitle: "Thank You!",
                successDesc: "Your feedback has been recorded."
            },
            hi: {
                title: "आपका अनुभव कैसा रहा?",
                nameLabel: "आपका नाम",
                tagsLabel: "क्या अच्छा रहा? (अधिकतम 5 टैग चुनें)",
                negTagsLabel: "सुधार के क्षेत्र (अधिकतम 5 टैग चुनें)",
                continueBtn: "आगे बढ़ें",
                readyTitle: "गूगल के लिए समीक्षा तैयार है",
                postGoogle: "गूगल समीक्षा पर पोस्ट करें",
                privateTitle: "सुधार के क्षेत्र",
                privateDesc: "कृपया सुधार के लिए नीचे दिए गए अधिकतम 5 टैग चुनें:",
                sendMgmt: "समीक्षा पोस्ट करें और प्रतिक्रिया भेजें",
                successTitle: "धन्यवाद!",
                successDesc: "आपकी प्रतिक्रिया दर्ज कर ली गई है।"
            },
            mr: {
                title: "तुमचा अनुभव कसा होता?",
                nameLabel: "तुमचे नाव",
                tagsLabel: "काय चांगले झाले? (जास्तीत जास्त ५ टॅग निवडा)",
                negTagsLabel: "सुधारणेचे क्षेत्र (जास्तीत जास्त ५ टॅग निवडा)",
                continueBtn: "पुढे जा",
                readyTitle: "गुगल रिव्ह्यू तयार आहे",
                postGoogle: "गुगल रिव्ह्यू वर पोस्ट करा",
                privateTitle: "सुधारणेचे क्षेत्र",
                privateDesc: "कृपया सुधारण्यासाठी खालीलपैकी जास्तीत जास्त ५ टॅग निवडा:",
                sendMgmt: "रिव्ह्यू पोस्ट करा आणि अभिप्राय पाठवा",
                successTitle: "धन्यवाद!",
                successDesc: "तुमचा अभिप्राय नोंदवला गेला आहे."
            }
        };

        function changeLanguage() {
            currentLang = document.getElementById('lang-selector').value;
            const t = i18n[currentLang];
            document.getElementById('ui-title').textContent = t.title;
            document.getElementById('ui-name-label').textContent = t.nameLabel;
            document.getElementById('ui-tags-label').textContent = t.tagsLabel;
            document.getElementById('ui-neg-tags-label').textContent = t.negTagsLabel;
            document.getElementById('proceed-btn').textContent = t.continueBtn;
            document.getElementById('ui-ready-title').textContent = t.readyTitle;
            document.getElementById('post-google-btn').textContent = t.postGoogle;
            document.getElementById('ui-private-title').textContent = t.privateTitle;
            document.getElementById('ui-private-desc').textContent = t.privateDesc;
            document.getElementById('submit-feedback-btn').textContent = t.sendMgmt;
            document.getElementById('ui-success-title').textContent = t.successTitle;
            document.getElementById('ui-success-desc').textContent = t.successDesc;
            
            if (currentRating > 0) renderTags();
        }

        fetch(`/api/business/public/${uniqueLink}`)
            .then(res => {
                if(!res.ok) throw new Error(res.status);
                return res.json();
            })
            .then(data => {
                businessData = data;
                document.getElementById('business-name').textContent = data.name;
            }).catch(e => {
                document.getElementById('main-content').innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border p-8 text-center">
                        <h2 class="text-xl font-bold text-slate-800 mb-2">Unavailable</h2>
                        <p class="text-slate-500 mb-6">This review link is invalid or disabled.</p>
                    </div>
                `;
            });

        window.tagTrans = {
            hi: {
                "Great Food": "बढ़िया खाना", "Fast Service": "तेज सेवा", "Clean": "साफ-सुथरा", "Friendly Staff": "मिलनसार स्टाफ", "Good Ambiance": "अच्छा माहौल", "Value for Money": "पैसा वसूल", "Fresh Ingredients": "ताजा सामग्री", "Tasty": "स्वादिष्ट", "Cozy Vibe": "आरामदायक माहौल", "Great Portions": "बढ़िया मात्रा", "Authentic Taste": "असली स्वाद", "Hygienic": "स्वच्छ", "Prompt Delivery": "तुरंत डिलीवरी", "Well Prepared": "अच्छी तरह तैयार", "Scenic View": "सुंदर दृश्य",
                "Slow Service": "धीमी सेवा", "Rude Staff": "रूखा स्टाफ", "Cold Food": "ठंडा खाना", "Dirty Tables": "गंदी टेबल", "Overpriced": "महंगा", "Small Portions": "कम मात्रा", "Noisy": "शोरगुल", "Bland Taste": "बेस्वाद", "Poor Quality": "खराब गुणवत्ता", "Unhygienic": "अस्वच्छ", "Stale Food": "बासी खाना", "Wrong Order": "गलत ऑर्डर", "Uncooked": "कच्चा", "Bad Smell": "बुरी गंध", "Cramped Seating": "तंग बैठने की जगह"
            },
            mr: {
                "Great Food": "उत्कृष्ट अन्न", "Fast Service": "जलद सेवा", "Clean": "स्वच्छ", "Friendly Staff": "अनुकूल कर्मचारी", "Good Ambiance": "चांगले वातावरण", "Value for Money": "पैशाचे मूल्य", "Fresh Ingredients": "ताज्या घटक", "Tasty": "चवदार", "Cozy Vibe": "सुखद वातावरण", "Great Portions": "उत्तम प्रमाण", "Authentic Taste": "अस्सल चव", "Hygienic": "आरोग्यदायी", "Prompt Delivery": "तातडीने डिलिव्हरी", "Well Prepared": "छान तयार केलेले", "Scenic View": "निसर्गरम्य दृश्य",
                "Slow Service": "हळू सेवा", "Rude Staff": "उद्धट कर्मचारी", "Cold Food": "थंड अन्न", "Dirty Tables": "मळके टेबल", "Overpriced": "महाग", "Small Portions": "कमी प्रमाण", "Noisy": "गोंगाट", "Bland Taste": "आळणी चव", "Poor Quality": "वाईट दर्जा", "Unhygienic": "अस्वच्छ", "Stale Food": "शिळे अन्न", "Wrong Order": "चुकीची ऑर्डर", "Uncooked": "न शिजलेले", "Bad Smell": "वाईट वास", "Cramped Seating": "कोंदट बसण्याची जागा"
            }
        };

        const starBtns = document.querySelectorAll('.star-btn');
        starBtns.forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                currentRating = idx + 1;
                starBtns.forEach((b, i) => b.classList.toggle('text-amber-400', i < currentRating));
                starBtns.forEach((b, i) => b.classList.toggle('text-slate-300', i >= currentRating));
                
                const negWrapper = document.getElementById('neg-tags-wrapper');
                const posWrapper = document.getElementById('pos-tags-wrapper');

                if (currentRating === 3) {
                    posWrapper.style.display = 'block';
                    negWrapper.style.display = 'block';
                    renderTags();
                } else if (currentRating >= 4) {
                    posWrapper.style.display = 'block';
                    negWrapper.style.display = 'none';
                    renderTags();
                } else {
                    posWrapper.style.display = 'none';
                    negWrapper.style.display = 'none';
                }
                
                document.getElementById('proceed-btn').disabled = false;
            });
        });

        function renderTags() {
            const posContainer = document.getElementById('tags-container');
            const negContainer = document.getElementById('neg-tags-container');
            posContainer.innerHTML = '';
            negContainer.innerHTML = '';
            
            selectedTags = [];
            selectedNegTags = [];
            
            let rawPos = businessData.positive_tags || [];
            let rawNeg = businessData.negative_tags || [];

            let posToUse = Array.isArray(rawPos) ? rawPos.map(t => String(t).trim()).filter(Boolean) : (typeof rawPos === 'string' ? rawPos.split(',').map(t => t.trim()).filter(Boolean) : []);
            let negToUse = Array.isArray(rawNeg) ? rawNeg.map(t => String(t).trim()).filter(Boolean) : (typeof rawNeg === 'string' ? rawNeg.split(',').map(t => t.trim()).filter(Boolean) : []);

            posToUse.forEach(tag => {
                const btn = document.createElement('button');
                let displayTag = tag;
                if (currentLang !== 'en' && window.tagTrans[currentLang] && window.tagTrans[currentLang][tag]) {
                    displayTag = window.tagTrans[currentLang][tag];
                }
                btn.textContent = displayTag;
                btn.className = "px-3 py-1.5 border border-slate-200 rounded-xl text-xs bg-white font-medium hover:border-blue-500 transition-all";
                btn.onclick = () => {
                    if(selectedTags.includes(tag)) {
                        selectedTags = selectedTags.filter(t => t !== tag);
                        btn.classList.remove('bg-blue-600', 'text-white');
                    } else {
                        if(selectedTags.length >= MAX_TAGS) return;
                        selectedTags.push(tag);
                        btn.classList.add('bg-blue-600', 'text-white');
                    }
                };
                posContainer.appendChild(btn);
            });

            negToUse.forEach(tag => {
                const btn = document.createElement('button');
                let displayTag = tag;
                if (currentLang !== 'en' && window.tagTrans[currentLang] && window.tagTrans[currentLang][tag]) {
                    displayTag = window.tagTrans[currentLang][tag];
                }
                btn.textContent = displayTag;
                btn.className = "px-3 py-1.5 border border-slate-200 rounded-xl text-xs bg-white font-medium hover:border-red-500 transition-all";
btn.onclick = () => {
                    if(selectedTags.includes(tag)) {
                        selectedTags = selectedTags.filter(t => t !== tag);
                        btn.classList.remove('bg-blue-600', 'text-white');
                        btn.classList.add('text-slate-800');
                    } else {
                        if(selectedTags.length >= MAX_TAGS) {
                            alert(currentLang === 'hi' ? "आप अधिकतम 5 टैग चुन सकते हैं।" : (currentLang === 'mr' ? "तुम्ही जास्तीत जास्त ५ टॅग निवडू शकता." : "You can select a maximum of 5 tags."));
                            return;
                        }
                        selectedTags.push(tag);
                        btn.classList.add('bg-blue-600', 'text-white');
                        btn.classList.remove('text-slate-800');
                    }
                };
                negContainer.appendChild(btn);
            });
        }

        document.getElementById('proceed-btn').addEventListener('click', () => {
            const customerName = document.getElementById('customer-name').value.trim();
            if(!customerName) {
                alert("Please enter your name.");
                return;
            }

            document.getElementById('step-rating').classList.add('hidden');
            
            if (currentRating >= 3) {
                document.getElementById('step-ai-review').classList.remove('hidden');
                
                // If 3 stars, silently save selected improvement tags as private feedback
                if (currentRating === 3 && selectedNegTags.length > 0) {
                    fetch('/api/reviews/submit', {
                        method: 'POST', headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({
                            business_link: uniqueLink,
                            customer_name: customerName,
                            rating: currentRating, 
                            tags: selectedNegTags, 
                            feedback_text: `3-Star Areas of Improvement: ${selectedNegTags.join(', ')}`, 
                            ai_draft: ""
                        })
                    });
                }

                fetch('/api/ai/generate-review', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        rating: currentRating, 
                        tags: selectedTags, 
                        business_name: businessData.name, 
                        category: businessData.category,
                        customer_name: customerName,
                        lang: currentLang
                    })
                }).then(res=>res.json()).then(data => {
                    document.getElementById('ai-loading').classList.add('hidden');
                    document.getElementById('ai-content').classList.remove('hidden');
                    document.getElementById('review-text-output').value = data.review;
                });
            } else {
                document.getElementById('step-feedback').classList.remove('hidden');
                // Render negative tags for 1-2 stars strict feedback step
                const negContainerStrict = document.getElementById('neg-tags-container-strict');
                negContainerStrict.innerHTML = '';
                selectedTags = [];
                let rawNeg = businessData.negative_tags || [];
                let negToUse = Array.isArray(rawNeg) ? rawNeg.map(t => String(t).trim()).filter(Boolean) : (typeof rawNeg === 'string' ? rawNeg.split(',').map(t => t.trim()).filter(Boolean) : []);
                negToUse.forEach(tag => {
                    const btn = document.createElement('button');
                    btn.textContent = tag;
                    btn.className = "px-3 py-1.5 border border-slate-200 rounded-xl text-xs bg-white font-medium hover:border-red-500 transition-all";
                    btn.onclick = () => {
                        if(selectedTags.includes(tag)) {
                            selectedTags = selectedTags.filter(t => t !== tag);
                            btn.classList.remove('bg-red-600', 'text-white');
                        } else {
                            if(selectedTags.length >= MAX_TAGS) return;
                            selectedTags.push(tag);
                            btn.classList.add('bg-red-600', 'text-white');
                        }
                    };
                    negContainerStrict.appendChild(btn);
                });
            }
        });

        async function saveReview(feedbackText = "", aiDraft = "") {
            await fetch('/api/reviews/submit', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    business_link: uniqueLink,
                    customer_name: document.getElementById('customer-name').value,
                    rating: currentRating, tags: currentRating >= 3 ? selectedTags : selectedTags, feedback_text: feedbackText, ai_draft: aiDraft
                })
            });
        }

        document.getElementById('post-google-btn').addEventListener('click', async () => {
            const aiText = document.getElementById('review-text-output').value;
            await saveReview("", aiText);
            navigator.clipboard.writeText(aiText).then(() => {
                window.location.href = businessData.google_link;
            });
        });

        document.getElementById('submit-feedback-btn').addEventListener('click', async () => {
            const extraText = document.getElementById('private-feedback-text').value;
            const combinedFeedback = `Selected Areas to Improve: ${selectedTags.join(', ')} | Notes: ${extraText}`;
            await saveReview(combinedFeedback, "");
            document.getElementById('step-feedback').classList.add('hidden');
            document.getElementById('step-success').classList.remove('hidden');
        });
    </script>
</body>
</html>
