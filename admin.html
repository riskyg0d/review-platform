<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Control User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8 min-h-screen">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold text-slate-900">Super Admin Control Panel</h1>
            <div class="flex space-x-3">
                <button onclick="document.getElementById('pwd-modal').classList.remove('hidden')" class="text-sm bg-blue-50 text-blue-700 border border-blue-200 px-4 py-2 rounded-lg hover:bg-blue-100 transition-all font-medium">Change Password</button>
                <button onclick="logout()" class="text-sm bg-white border border-slate-300 px-4 py-2 rounded-lg hover:bg-slate-50 transition-all font-medium shadow-sm">Log Out</button>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-semibold mb-4 text-slate-800">All Registered Businesses</h2>
                <div id="businesses-list" class="space-y-3 h-96 overflow-y-auto pr-2"></div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-semibold mb-4 text-slate-800">Platform-Wide Reviews</h2>
                <div id="reviews-list" class="space-y-4 h-96 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>
    <!-- Change Password Modal -->
    <div id="pwd-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full shadow-lg border border-slate-200">
            <h2 class="text-xl font-bold mb-1 text-slate-900">Change Password</h2>
            <p class="text-sm text-slate-500 mb-6">Update your Super Admin credentials securely.</p>
            <label class="block text-xs font-semibold mb-1 text-slate-700">Current Password</label>
            <input type="password" id="old-pwd" class="w-full p-3 border rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 text-sm">
            <label class="block text-xs font-semibold mb-1 text-slate-700">New Password</label>
            <input type="password" id="new-pwd" class="w-full p-3 border rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 text-sm">
            <label class="block text-xs font-semibold mb-1 text-slate-700">Confirm New Password</label>
            <input type="password" id="confirm-pwd" class="w-full p-3 border rounded-xl mb-6 focus:ring-2 focus:ring-blue-500 text-sm">
            <div class="flex justify-end space-x-3">
                <button onclick="closePwdModal()" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition-all">Cancel</button>
                <button onclick="changePassword()" class="px-5 py-2.5 text-sm font-medium bg-blue-600 text-white rounded-xl hover:bg-blue-700 shadow-sm transition-all">Save Password</button>
            </div>
        </div>
    </div>
    <script>
        async function loadBusinesses() {
            const res = await fetch('/api/admin/businesses');
            if(res.status === 401) return window.location.href="/";
            const data = await res.json();
            const list = document.getElementById('businesses-list');
            list.innerHTML = data.map(b => `
                <div class="p-4 border rounded-xl flex justify-between items-center bg-slate-50 ${b.status === 'disabled' ? 'opacity-60' : ''}">
                    <div>
                        <p class="font-bold text-slate-900">${b.name}</p>
                        <p class="text-xs text-slate-500">Owner: ${b.owner_email}</p>
                        <p class="text-xs mt-1 font-semibold ${b.status === 'approved' ? 'text-green-600' : (b.status === 'disabled' ? 'text-red-600' : 'text-amber-600')}">${b.status.toUpperCase()}</p>
                    </div>
                    <div class="flex flex-col space-y-2 text-right">
                        ${b.status === 'pending' ? `<button onclick="toggleStatus(${b.id}, 'approved')" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-medium">Approve</button>` : ''}
                        ${b.status === 'approved' ? `
                            <button onclick="toggleStatus(${b.id}, 'disabled')" class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1 rounded-lg text-xs font-medium border border-red-200 transition-all">Disable</button>
                            <a href="/review/${b.unique_link}" target="_blank" class="text-blue-600 text-xs font-medium hover:underline">View Public Link ↗</a>
                        ` : ''}
                        ${b.status === 'disabled' ? `<button onclick="toggleStatus(${b.id}, 'approved')" class="bg-green-100 text-green-700 hover:bg-green-200 px-3 py-1 rounded-lg text-xs font-medium border border-green-200 transition-all">Enable</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
        async function loadReviews() {
            const res = await fetch('/api/admin/reviews');
            const data = await res.json();
            const list = document.getElementById('reviews-list');
            list.innerHTML = data.map(r => `
                <div class="p-4 border rounded-xl bg-slate-50 text-sm text-slate-800">
                    <div class="flex justify-between font-bold mb-1">
                        <span>[${r.business_name}] ${r.customer_name}</span>
                        <span class="text-amber-500">${'★'.repeat(r.rating)}</span>
                    </div>
                    <p class="text-xs text-slate-500 mb-2">Tags: ${r.tags}</p>
                    ${r.rating < 3 ? `<p class="text-red-700 bg-red-100 p-2 rounded">Private Feedback: ${r.feedback_text}</p>` : `<p class="text-green-700 bg-green-100 p-2 rounded">AI Draft: ${r.ai_draft}</p>`}
                </div>
            `).join('');
        }
        async function toggleStatus(id, newStatus) {
            await fetch('/api/admin/businesses/toggle', {
                method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({business_id: id, status: newStatus})
            });
            loadBusinesses();
        }
        function closePwdModal() {
            document.getElementById('pwd-modal').classList.add('hidden');
            document.getElementById('old-pwd').value = '';
            document.getElementById('new-pwd').value = '';
            document.getElementById('confirm-pwd').value = '';
        }
        async function changePassword() {
            const oldPwd = document.getElementById('old-pwd').value;
            const newPwd = document.getElementById('new-pwd').value;
            const confirmPwd = document.getElementById('confirm-pwd').value;
            if(!oldPwd || !newPwd || !confirmPwd) return alert("Please fill out all fields");
            if(newPwd !== confirmPwd) return alert("The new passwords do not match!");
            const res = await fetch('/api/admin/change-password', {
                method: 'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({old_password: oldPwd, new_password: newPwd})
            });
            if(res.ok) {
                alert("Password successfully updated!");
                closePwdModal();
            } else {
                const data = await res.json();
                alert(data.detail || "Error changing password");
            }
        }
        async function logout() {
            await fetch('/api/auth/logout', {method: 'POST'});
            window.location.href = "/";
        }
        loadBusinesses();
        loadReviews();
    </script>
</body>
</html>
