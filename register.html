<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Business Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-md w-full">
        <h1 class="text-2xl font-bold mb-2 text-center text-slate-900">Register Your Business</h1>
        <p class="text-slate-500 text-sm text-center mb-6">Create your account and select your category.</p>
        <div id="step-details" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">Email or Phone Number</label>
                <input type="text" id="r-identifier" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="you@business.com or +919876543210">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">Business Name</label>
                <input type="text" id="r-name" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="The Local Cafe">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">Business Category</label>
                <select id="r-category" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="Restaurant / Cafe">Restaurant / Cafe</option>
                    <option value="Salon / Spa">Salon / Spa</option>
                    <option value="Retail / Shopping">Retail / Shopping</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">Google Maps Link</label>
                <input type="text" id="r-link" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="https://maps.google.com/...">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">Set Quick Login PIN (4 Digits)</label>
                <input type="password" id="r-pin" maxlength="4" class="w-full p-3 border rounded-xl tracking-widest text-center text-lg focus:ring-2 focus:ring-blue-500" placeholder="••••">
            </div>
            <button onclick="sendOTP()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-medium hover:bg-slate-800 transition-all mt-2">Send Verification Code</button>
        </div>
        <div id="step-verify" class="hidden space-y-4">
            <p class="text-xs text-blue-600 bg-blue-50 p-2 rounded text-center">Verification code sent! (Check console logs)</p>
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">Enter 6-Digit Code</label>
                <input type="text" id="otp-code" class="w-full p-3 border rounded-xl tracking-widest text-center text-lg focus:ring-2 focus:ring-blue-500" placeholder="123456">
            </div>
            <button onclick="verifyAndRegister()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 transition-all mt-2">Verify & Register</button>
        </div>
        <div class="mt-6 text-center text-sm">
            <a href="/" class="text-blue-600 font-semibold hover:underline">← Back to Login</a>
        </div>
    </div>
    <script>
        function isValidEmail(val) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val); }
        function isValidPhone(val) { return /^\+?[0-9]{10,15}$/.test(val); }

        async function sendOTP() {
            const identifier = document.getElementById('r-identifier').value.trim();
            const name = document.getElementById('r-name').value.trim();
            const link = document.getElementById('r-link').value.trim();
            
            if(!identifier || !name || !link) return alert("Fill all fields");
            if(!isValidEmail(identifier) && !isValidPhone(identifier)) {
                return alert("Please enter a valid email address or phone number.");
            }

            const res = await fetch('/api/auth/register-otp', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({identifier: identifier})
            });
            if(res.ok) {
                document.getElementById('step-details').classList.add('hidden');
                document.getElementById('step-verify').classList.remove('hidden');
            } else {
                const data = await res.json();
                alert(data.detail || "Error sending code");
            }
        }
        async function verifyAndRegister() {
            const identifier = document.getElementById('r-identifier').value.trim();
            const name = document.getElementById('r-name').value.trim();
            const category = document.getElementById('r-category').value;
            const link = document.getElementById('r-link').value.trim();
            const pin = document.getElementById('r-pin').value.trim();
            const otp = document.getElementById('otp-code').value.trim();
            if(!otp) return alert("Enter OTP");
            
            const res = await fetch('/api/auth/register-verify', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({identifier, otp, pin, business_name: name, category, google_link: link})
            });
            if(res.ok) {
                alert("Registration successful! Redirecting to login.");
                window.location.href = "/";
            } else {
                alert("Invalid OTP. Trust code.");
            }
        }
    </script>
</body>
</html>
